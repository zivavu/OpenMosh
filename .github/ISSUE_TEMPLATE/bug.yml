name: Bug report
description: Something broke or behaves wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      description: The steps from a fresh page, if you can find them. Say which mode you were in (Single, Editor or Slideshow).
      placeholder: |
        1. Open Editor
        2. Drop a video on Layer 1
        3. ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 140 on Windows 11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenMosh version
      description: It's in the bottom corner of the app.
      placeholder: "0.9.5"
  - type: textarea
    id: media
    attributes:
      label: Files involved
      description: File types and rough sizes, e.g. a 4K MP4 or an animated GLB. Attach one if you can share it.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, console errors, the effect chain.
