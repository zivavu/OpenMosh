name: PR title

# PRs are squash-merged under their title, and release-please builds the changelog
# from those titles, so each one has to be a conventional commit.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            refactor
            docs
            test
            ci
            build
            chore
            style
          # The changelog line reads as a sentence: "feat: Lock effects through moshes".
          subjectPattern: ^[A-Z].*$
          subjectPatternError: Start the title's subject with a capital letter.
