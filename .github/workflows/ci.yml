name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # svelte-check + tsc over the app, the node config and the e2e suite.
      - run: bun run check

      # Coverage is printed, not gated: the number is a baseline to watch, and
      # a threshold would only ever be met by testing what is easy to test.
      - run: bun run test:coverage

      # A green type-check doesn't prove the bundle builds.
      - run: bun run build

  # Separate job: it needs a browser download and takes minutes, and a failure
  # here means something different from a failing unit test.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - run: bun install --frozen-lockfile

      # Deliberately not --with-deps. That runs apt-get update, which fails the
      # whole job whenever any third-party source on the runner image serves an
      # index that doesn't match its own hashes — Google's Chrome repo does this
      # periodically, and one bad repo fails the update regardless of whether
      # anything is needed from it.
      #
      # Nothing is: the runner image ships Chrome, Chromium and Edge, so every
      # shared library Playwright's Chromium links against is already installed.
      # Skipping apt removes the entire class of failure rather than racing it.
      # If a library ever does go missing, capabilities.spec.ts is what says so.
      - run: bunx playwright install chromium

      - run: bun run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
