name: CI

# PR-only: main takes nothing but PRs, so a push to main re-tests code that already passed.
on:
  pull_request:

concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    # The release PR only bumps the version and changelog; a skipped job satisfies the ruleset.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      # svelte-check + tsc over the app, the node config and the e2e suite.
      - run: bun run check

      - run: bun run format:check

      # Coverage is printed, not gated: the number is a baseline to watch, and
      # a threshold would only ever be met by testing what is easy to test.
      - run: bun run test:coverage

      # A green type-check doesn't prove the bundle builds.
      - run: bun run build

  # Separate job: it needs a browser download and takes minutes, and a failure
  # here means something different from a failing unit test. Split across three
  # runners, since one runner's CPU can't take a second worker; by file rather
  # than --shard, which balances test counts, not time.
  e2e-part:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    name: e2e (${{ matrix.part }}/3)
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      # Deliberately not --with-deps. That runs apt-get update, which fails the
      # whole job whenever any third-party source on the runner image serves an
      # index that doesn't match its own hashes — Google's Chrome repo does this
      # periodically, and one bad repo fails the update regardless of whether
      # anything is needed from it.
      #
      # Nothing is: the runner image ships Chrome, Chromium and Edge, so every
      # shared library Playwright's Chromium links against is already installed.
      # Skipping apt removes the entire class of failure rather than racing it.
      # If a library ever does go missing, capabilities.spec.ts is what says so.
      - id: playwright
        run: echo "version=$(bunx playwright --version | cut -d" " -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - run: bunx playwright install chromium

      - if: matrix.part != 3
        run: bun run test:e2e --test-list tests/e2e/ci-part-${{ matrix.part }}.txt

      - if: matrix.part == 3
        run: |
          cat tests/e2e/ci-part-1.txt tests/e2e/ci-part-2.txt > "$RUNNER_TEMP/ci-parts.txt"
          bun run test:e2e --test-list-invert "$RUNNER_TEMP/ci-parts.txt"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.part }}
          path: playwright-report
          retention-days: 7

  # The main ruleset requires a check named "e2e"; matrix jobs don't report under it.
  e2e:
    needs: e2e-part
    if: ${{ always() && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.e2e-part.result }}" = success
