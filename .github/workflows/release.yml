name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  # Keeps the release PR up to date; merging it tags the version and publishes the release.
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PR opened with the default token doesn't trigger CI, and main requires CI
          # to merge, so the release PR is opened with a personal token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Vercel serves the production branch, so moving it to the new tag is the deploy.
  promote:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git push origin "refs/tags/${{ needs.release-please.outputs.tag }}^{commit}:refs/heads/production"
