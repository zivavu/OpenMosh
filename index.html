<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>OpenMosh</title>
		<meta
			name="description"
			content="Browser-based glitch art studio. Drop in a photo or video, layer WebGL effects, sync them to your music, or sequence images into a beat-matched slideshow — all client-side."
		/>
		<link rel="canonical" href="https://openmosh.com/" />
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="apple-touch-icon" href="/icon-192.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta name="theme-color" content="#0a0a0c" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="OpenMosh" />
		<meta property="og:title" content="OpenMosh" />
		<meta
			property="og:description"
			content="Glitch art in your browser. Drop in a photo or video, pile on effects and sync them to a song. Nothing gets uploaded."
		/>
		<meta property="og:url" content="https://openmosh.com/" />
		<meta property="og:image" content="https://openmosh.com/og.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="OpenMosh in glitched chrome lettering"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "OpenMosh",
				"url": "https://openmosh.com/",
				"description": "Glitch art in your browser. Drop in a photo or video, pile on effects and sync them to a song. Nothing gets uploaded.",
				"image": "https://openmosh.com/og.jpg",
				"applicationCategory": "MultimediaApplication",
				"operatingSystem": "Any",
				"browserRequirements": "Requires WebGL2",
				"isAccessibleForFree": true,
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
				"license": "https://github.com/zivavu/OpenMosh/blob/main/LICENSE",
				"sameAs": ["https://github.com/zivavu/OpenMosh"]
			}
		</script>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
