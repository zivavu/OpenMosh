<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>OpenMosh — Music Lab</title>
		<style>
			:root {
				--bg: #0e0f11;
				--panel: #16181c;
				--line: #262a31;
				--text: #d7dae0;
				--dim: #7d8490;
				--accent: #ffb454;
				--bad: #ff5c5c;
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
				font-size: 13px;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
				background: var(--bg);
				color: var(--text);
			}
			body {
				display: grid;
				grid-template-columns: 1fr 320px;
				height: 100vh;
				overflow: hidden;
			}
			main {
				display: flex;
				flex-direction: column;
				min-width: 0;
			}
			#stage {
				position: relative;
				flex: 1;
				min-height: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #000;
				padding: 12px;
			}
			#view {
				max-width: 100%;
				max-height: 100%;
			}
			#view.off {
				visibility: hidden;
			}
			#overlay {
				position: absolute;
				inset: 0;
				display: none;
				align-items: center;
				justify-content: center;
				color: var(--dim);
				font-size: 15px;
			}
			#overlay.show {
				display: flex;
			}
			#hud {
				position: absolute;
				left: 14px;
				top: 12px;
				white-space: pre;
				font:
					11px ui-monospace,
					Consolas,
					monospace;
				color: var(--dim);
				text-shadow: 0 0 3px #000;
				pointer-events: none;
			}
			#stripWrap {
				position: relative;
				height: 56px;
				background: #08090b;
				border-top: 1px solid var(--line);
			}
			#strip {
				display: block;
				width: 100%;
				height: 100%;
				cursor: pointer;
			}
			#playhead {
				position: absolute;
				top: 0;
				bottom: 0;
				width: 1px;
				background: var(--accent);
				pointer-events: none;
			}
			#toolbar {
				display: flex;
				flex-wrap: wrap;
				gap: 6px;
				align-items: center;
				padding: 8px 10px;
				border-top: 1px solid var(--line);
				background: var(--panel);
			}
			#clock {
				margin-left: auto;
				color: var(--dim);
				font-variant-numeric: tabular-nums;
			}
			button,
			select,
			input[type="number"] {
				background: #1f232a;
				color: var(--text);
				border: 1px solid var(--line);
				border-radius: 4px;
				padding: 4px 9px;
				font: inherit;
				cursor: pointer;
			}
			input[type="number"] {
				width: 90px;
				cursor: text;
			}
			button:hover {
				border-color: #3a404b;
			}
			aside {
				background: var(--panel);
				border-left: 1px solid var(--line);
				overflow-y: auto;
				padding: 10px 12px 24px;
			}
			h4 {
				margin: 14px 0 6px;
				font-size: 11px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
				color: var(--dim);
				font-weight: 600;
			}
			.lane {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 3px 0;
			}
			.lane span {
				flex: 1;
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.lane button {
				padding: 0 6px;
			}
			.hint {
				color: var(--dim);
				font-size: 11px;
				line-height: 1.5;
			}
			#forms {
				display: flex;
				flex-wrap: wrap;
				gap: 4px 12px;
			}
			#forms label {
				display: flex;
				align-items: center;
				gap: 4px;
			}
			.ctl {
				margin-bottom: 8px;
			}
			.ctl label {
				display: flex;
				justify-content: space-between;
				color: var(--dim);
				font-size: 11px;
				margin-bottom: 2px;
			}
			.ctl label span {
				color: var(--text);
				font-variant-numeric: tabular-nums;
			}
			.ctl input {
				width: 100%;
			}
			#error {
				display: none;
				white-space: pre-wrap;
				font:
					11px ui-monospace,
					Consolas,
					monospace;
				color: var(--bad);
				margin-top: 12px;
			}
			#error.show {
				display: block;
			}
		</style>
	</head>
	<body>
		<main>
			<div id="stage">
				<canvas id="view" class="off"></canvas>
				<div id="overlay" class="show"></div>
				<div id="hud"></div>
			</div>
			<div id="stripWrap">
				<canvas id="strip"></canvas>
				<div id="playhead"></div>
			</div>
			<div id="toolbar">
				<button id="play">Play</button>
				<input id="seed" type="number" min="0" step="1" title="Seed" />
				<button id="reroll" title="Random seed">Reroll</button>
				<select id="palette" title="Palette"></select>
				<select id="ratio" title="Aspect ratio"></select>
				<select id="short" title="Short side in pixels">
					<option value="540">540p</option>
					<option value="720">720p</option>
					<option value="1080">1080p</option>
				</select>
				<button id="reset" title="Back to the default knobs and every form">
					Reset
				</button>
				<button id="copy" title="Copy every setting as JSON">
					Copy settings
				</button>
				<span id="clock"></span>
			</div>
		</main>
		<aside>
			<h4>Lanes</h4>
			<div id="lanes"></div>
			<button id="add">Add audio</button>
			<input id="file" type="file" accept="audio/*" multiple hidden />
			<p class="hint">
				Every lane is heard. Ticked lanes drive the picture, like Drives in the
				editor. <b>Space</b> plays, <b>←</b> <b>→</b> jump 5 s, click the strip
				to seek. White ticks on the strip are form changes.
			</p>
			<h4>Forms</h4>
			<div id="forms"></div>
			<div id="knobs"></div>
			<div id="error"></div>
		</aside>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
